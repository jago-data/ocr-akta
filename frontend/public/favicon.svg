<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" role="img" aria-label="OCR Akta">
  <!-- The same mark the login page and sidebar already wear: lucide's scan-text glyph on
       the brand square (tailwind.config.js `brand` #D42030 → `brand.dark` #A8182A). Drawn
       as one SVG rather than exported from the icon font so the tab, the header and the
       login screen cannot drift apart. -->
  <defs>
    <linearGradient id="akta" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#D42030"/>
      <stop offset="1" stop-color="#A8182A"/>
    </linearGradient>
  </defs>
  <rect width="32" height="32" rx="8" fill="url(#akta)"/>
  <!-- 24px glyph scaled to 18px and centred. Strokes are set at 2.4 rather than lucide's
       2 because the 0.75 scale thins them, and at a 16px tab they must still read. -->
  <g transform="translate(7 7) scale(0.75)" fill="none" stroke="#fff" stroke-width="2.4"
     stroke-linecap="round" stroke-linejoin="round">
    <path d="M3 7V5a2 2 0 0 1 2-2h2"/>
    <path d="M17 3h2a2 2 0 0 1 2 2v2"/>
    <path d="M21 17v2a2 2 0 0 1-2 2h-2"/>
    <path d="M7 21H5a2 2 0 0 1-2-2v-2"/>
    <path d="M7 9h10"/>
    <path d="M7 13h10"/>
    <path d="M7 17h6"/>
  </g>
</svg>
